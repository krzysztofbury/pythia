services:
  oracle-pythia:
    image: python:3.13-slim-bookworm
    container_name: oracle-pythia
    restart: unless-stopped
    working_dir: /app
    # Fix for QNAP DNS issues:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - /share/homes/morb1/oracle-pythia-v3:/app
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - KRAKEN_API_KEY=your_key
      - KRAKEN_PRIVATE_KEY=your_secret
      - GOOGLE_API_KEY=your_gemini_key
      - XAI_API_KEY=your_grok_key
      - XAI_MODEL=grok-4-fast-non-reasoning
      - GEMINI_MODEL=gemini-3-flash-preview
      - QUOTE_CURRENCY=USDC
      - TRADING_MODE=PAPER
      - MAX_POSITION_SIZE_USD=50.0
      - TRADING_UNIVERSE=BTC/USDC,ETH/USDC,SOL/USDC,XRP/USDC,DOGE/USDC,SHIB/USDC,LINK/USDC
      - TIMEOUT_SECONDS=3600
    command: >
      sh -c "pip install uv && 
             uv sync --frozen --no-dev && 
             uv run python src/main.py"