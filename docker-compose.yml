name: oracle-pythia-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: 10m

services:
  warp-proxy:
    image: ghcr.io/mon-ius/docker-warp-socks:v6
    container_name: warp-proxy
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /etc/sing-box:rw,noexec,nosuid,size=16m,mode=0700
    healthcheck:
      test:
        - CMD
        - curl
        - -x
        - socks5h://127.0.0.1:9091
        - -fsSL
        - https://www.cloudflare.com/cdn-cgi/trace
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - proxy-egress
    logging: *default-logging

  oracle-pythia:
    image: oracle-pythia:dev
    container_name: oracle-pythia
    build:
      context: .
      args:
        VERSION: dev
    platform: linux/amd64
    restart: unless-stopped
    init: true
    depends_on:
      warp-proxy:
        condition: service_healthy
    env_file:
      - ${PYTHIA_ENV_FILE:-.env}
    environment:
      LIVE_ENTRIES_ENABLED: "false"
      MAX_DCA_PER_POSITION: "0"
      PARTIAL_EXIT_ENABLED: "false"
      TRADING_MODE: PAPER
      WARP_PROXY: socks5h://warp-proxy:9091
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    volumes:
      - oracle-logs:/app/logs
    networks:
      - proxy-egress
    logging: *default-logging

networks:
  proxy-egress:
    internal: false

volumes:
  oracle-logs:
