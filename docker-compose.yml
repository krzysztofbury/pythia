services:
  warp-proxy:
    image: ghcr.io/mon-ius/docker-warp-socks:v5
    container_name: warp-proxy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - WARP_SLEEP=2

  oracle-pythia:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: oracle-pythia
    restart: unless-stopped
    working_dir: /app
    entrypoint: []
    depends_on:
      - warp-proxy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
      - WARP_PROXY=socks5h://warp-proxy:9091
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; f='logs/healthcheck'; exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<3600 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
