[project]
name = "oracle-pythia"
version = "8.2.0"
description = "Autonomous crypto trading bot on Kraken with algorithmic strategy, Grok sentiment, Polymarket odds, and quantitative analysis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ccxt>=4.5.35",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tenacity>=9.0.0",
    "xai-sdk>=1.6.1",
    "ta>=0.11.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "quantstats>=0.0.64",
    "Backtesting>=0.3.3",
    "arch>=7.0.0",
    "pmdarima>=2.0.4",
    "PySocks>=1.7.1",
    "optuna>=4.0.0",
]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "CPY",  # Missing copyright header
    "ANN101", # Missing type annotation for `self` in method (deprecated in newer ruff, but safe to ignore)
    "ANN102", # Missing type annotation for `cls` in classmethod
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG005", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
exclude-newer = "2026-05-13T00:00:00Z"
