[project]
name = "oracle-pythia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ccxt>=4.5.35",
    "google-genai>=1.60.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "xai-sdk>=1.6.1",
]

[tool.setuptools.package-dir]
"" = "src"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
    "CPY",  # Missing copyright header
    "ANN101", # Missing type annotation for `self` in method (deprecated in newer ruff, but safe to ignore)
    "ANN102", # Missing type annotation for `cls` in classmethod
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG005", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
