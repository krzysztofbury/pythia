version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    ignore:
      # SPEC safety invariant 1 pins Python 3.13 in CI and in the runtime
      # image. A major base-image bump has to be a deliberate, tested change,
      # not an automated one.
      - dependency-name: python
        update-types:
          - version-update:semver-major

# No entry for /deploy/qnap: it holds no Dockerfile, so the docker ecosystem
# aborts there with "No Dockerfiles nor Kubernetes YAML found", and its
# compose.yaml expresses every image as a ${VAR:-default} indirection that
# Dependabot cannot rewrite. The two third-party images pinned in those
# defaults (warp-socks, watchtower) are operator-reviewed by hand.
