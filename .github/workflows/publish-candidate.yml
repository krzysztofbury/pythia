name: Publish candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-candidate
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  publish:
    name: Build and publish linux/amd64 candidate
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing SHA tag
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA}"
          if output="$(docker buildx imagetools inspect "${image}" 2>&1)"; then
            echo "Refusing to overwrite existing one-time SHA tag ${image}." >&2
            exit 1
          fi
          lower_output="${output,,}"
          if [[ "${lower_output}" != *"not found"* && "${lower_output}" != *"manifest unknown"* ]]; then
            echo "Could not establish that ${image} is absent:" >&2
            echo "${output}" >&2
            exit 1
          fi

      - name: Record build timestamp
        id: metadata
        shell: bash
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Build once and push candidate tags
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:candidate
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            VERSION=candidate-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest the published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarize candidate
        shell: bash
        run: |
          {
            echo "### Candidate published"
            echo
            echo "- Image: \`ghcr.io/${{ github.repository }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- One-time SHA tag: \`sha-${{ github.sha }}\`"
            echo "- The digest above is the promotion and rollback authority."
          } >> "${GITHUB_STEP_SUMMARY}"
