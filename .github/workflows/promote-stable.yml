name: Promote stable

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character Git SHA tested by Publish candidate
        required: true
        type: string
      candidate_digest:
        description: Full candidate digest (sha256 followed by 64 hex characters)
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to retag this exact digest as stable
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact digest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DIGEST: ${{ inputs.candidate_digest }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Validate manual inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "${CONFIRMATION}" = "PROMOTE"
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify digest belongs to the tested SHA tag
        shell: bash
        run: |
          source="${IMAGE}:sha-${CANDIDATE_SHA}"
          source_digest="sha256:$(docker buildx imagetools inspect "${source}" --raw | sha256sum | cut -d ' ' -f 1)"
          echo "Tested SHA tag: ${source}"
          echo "SHA tag digest: ${source_digest}"
          echo "Requested digest: ${DIGEST}"
          test "${source_digest}" = "${DIGEST}"

      - name: Promote without rebuilding
        run: docker buildx imagetools create --tag "${IMAGE}:stable" "${IMAGE}@${DIGEST}"

      - name: Verify remote stable digest
        shell: bash
        run: |
          actual="sha256:$(docker buildx imagetools inspect "${IMAGE}:stable" --raw | sha256sum | cut -d ' ' -f 1)"
          echo "Requested digest: ${DIGEST}"
          echo "Remote stable:   ${actual}"
          test "${actual}" = "${DIGEST}"
          {
            echo "### Stable promoted"
            echo
            echo "- Image: \`${IMAGE}:stable\`"
            echo "- Tested revision: \`${CANDIDATE_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
